name: weather-station
services:
  sensor-1:
    build:
      context: ./sensor
    ports: ["5001:5000"]
    networks:
      - sensor-net

  sensor-2:
    build:
      context: ./sensor
    ports: ["5002:5000"]
    networks:
      - sensor-net

  sensor-3:
    build:
      context: ./sensor
    ports: ["5003:5000"]
    networks:
      - sensor-net
  sampler:
    build: ./sampler
    ports: ["3000:3000"]
    depends_on: [sensor-1, sensor-2, sensor-3]
    networks:
      - sensor-net
  transformer:
    build:
      context: ./transformer
    ports: ["4000:4000"]
    networks:
      - sensor-net
    depends_on: [sampler]

networks:
  sensor-net:
    name: sensor-net
