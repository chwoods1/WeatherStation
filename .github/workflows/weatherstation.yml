name: Weather Station CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install transformer dependencies
        run: pip install -r transformer/requirements.txt

      - name: Run transformer tests
        run: pytest transformer/test_transformer.py -v
      
      - name: Install sampler dependencies
        run: npm install --prefix sampler
      
      - name: Run sampler tests
        run: npm test --prefix sampler

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Build all services
        run: docker compose build
 
      - name: Start all services
        run: docker compose up -d
 
      - name: Wait for API to be ready
        run: sleep 15
 
      - name: Test API stores temperature
        run: |
          curl -sk -X POST https://localhost:8443/temperature \
            -H "Content-Type: application/json" \
            -d '{"temperature": 24.5, "timestamp": 1775889310.6431897}'
 
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    needs: integration
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/weather-station
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.weather.yml down
            docker compose -f docker-compose.weather.yml up -d --build
